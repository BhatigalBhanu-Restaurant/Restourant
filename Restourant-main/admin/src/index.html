    <script>
      // Enhanced clipboard: copy image data URLs as actual image blobs
      // so the image itself (not the URL string) gets copied to clipboard.
      if (navigator.clipboard && navigator.clipboard.write) {
        const _origWrite = navigator.clipboard.write.bind(navigator.clipboard);
        navigator.clipboard.write = async (items: any[]) => {
          try {
            return await _origWrite(items);
          } catch (e: any) {
            const textItem = items.find((item: any) => item.types && item.types.includes('text/plain'));
            if (textItem) {
              try {
                const blob = await textItem.getType('text/plain');
                const text = await blob.text();
                return await navigator.clipboard.writeText(text);
              } catch (_) {}
            }
            throw e;
          }
        };
      }
    </script>
